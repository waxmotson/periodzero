<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="lane head.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>periodzero</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #111;
      color: #fff;
      background-image: url("backgrounds/placeholder.png");
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #periods {
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vh 0;
      scrollbar-width: none;
    }
    #periods::-webkit-scrollbar { display: none; }
    .period-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
      margin: 0 0 2.5vh;
      max-width: 100%;
    }
    .label {
      font-size: 2vw;
      margin-bottom: 20px;
      background-color: rgba(15,15,15,0.6);
      text-align: center;
    }
    .subject {
      font-size: 6vw;
      text-align: center;
      background-color: rgba(15,15,15,0.6);
      overflow-wrap: anywhere;
      max-width: 96vw;
    }
    @media (max-width: 600px) {
      .label { font-size: 4vw; margin-bottom: 10px; }
      .subject { font-size: 8vw; }
      .period-row { margin-bottom: 2vh; }
    }
  </style>
</head>
<body>
  <main id="periods" aria-live="polite"></main>
  <script>
    // Week A Thursday is 22 October 2026; alternate A/B weeks through 4 December.
    const FIRST_DATE = new Date(2026, 9, 22);
    const LAST_DATE = new Date(2026, 11, 4);
    const CYCLE_MONDAY = new Date(2026, 9, 19);
    const timetable = {
      A: {
        Monday:    { p1: "bs", p2: "ma", p3: "FREE", tut: "assem", p4: "eco", p5: "engadv" },
        Tuesday:   { p0: "ma", p1: "eco", p2: "eco", p3: "geo", tut: "tut", p4: "FREE", p5: "FREE" },
        Wednesday: { p1: "cd", p2: "bs", p3: "engadv", tut: "tut", p4: "ma", p5: "geo" },
        Thursday:  { p1: "bs", p2: "bs", p3: "engadv", tut: "tut", p4: "ma", p5: "eco" },
        Friday:    { p1: "FREE", p2: "geo", p3: "geo", tut: "chap", p4: "eco", p5: "engadv" }
      },
      B: {
        Monday:    { p1: "FREE", p2: "bs", p3: "eco", tut: "tut", p4: "ma", p5: "FREE" },
        Tuesday:   { p0: "ma", p1: "FREE", p2: "ma", p3: "eco", tut: "ym", p4: "geo", p5: "engadv" },
        Wednesday: { p1: "ma", p2: "ma", p3: "geo", tut: "tut", p4: "engadv", p5: "ma" },
        Thursday:  { p1: "FREE", p2: "ma", p3: "bs", tut: "hm", p4: "engadv", p5: "ma" },
        Friday:    { p1: "bs", p2: "cd", p3: "geo", tut: "chap", p4: "FREE", p5: "FREE" }
      }
    };
    const names = {
      ma: "MATHS", bs: "BUSINESS STUDIES", eco: "ECONOMICS", cd: "CD",
      geo: "GEOGRAPHY", engadv: "ENGLISH ADVANCED", assem: "ASSEMBLY",
      tut: "TUTORIAL", chap: "CHAPEL", hm: "HOUSE MEETING", ym: "YEAR MEETING",
      FREE: "FREE"
    };
    const periods = [
      { id: "p0", label: "PERIOD 0" },
      { id: "p1", label: "PERIOD 1" },
      { id: "p2", label: "PERIOD 2" },
      { id: "p3", label: "PERIOD 3" },
      { id: "tut", label: "TUTORIAL" },
      { id: "p4", label: "PERIOD 4" },
      { id: "p5", label: "PERIOD 5" }
    ];
    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const addDays = (d, n) => { const out = new Date(d); out.setDate(out.getDate() + n); return out; };
    const minutes = d => d.getHours() * 60 + d.getMinutes();

    function weekFor(date) {
      const monday = midnight(date);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      const weeks = Math.floor((monday - CYCLE_MONDAY) / 604800000);
      return ((weeks % 2) + 2) % 2 === 0 ? "A" : "B";
    }
    function isSchoolDay(date) {
      return date.getDay() >= 1 && date.getDay() <= 5 &&
        midnight(date) >= midnight(FIRST_DATE) && midnight(date) <= midnight(LAST_DATE);
    }
    function nextSchoolDay(from) {
      let d = midnight(from);
      for (let i = 0; i < 10; i++, d = addDays(d, 1)) if (isSchoolDay(d)) return d;
      return null;
    }
    function scheduleFor(date) {
      return timetable[weekFor(date)][dayNames[date.getDay()]] || {};
    }
    function nextSchoolDayView(now) {
      const date = nextSchoolDay(addDays(midnight(now), 1));
      return date ? { date, ids: ["p0", "p1", "p2", "p3", "tut", "p4", "p5"] } : null;
    }
    function upcoming(now) {
      if (midnight(now) > midnight(LAST_DATE)) return null;
      const date = midnight(now), m = minutes(now);
      if (!isSchoolDay(date) || m >= 915) return nextSchoolDayView(now);
      if (m < 450) return { date, ids: ["p0", "p1", "p2"] };
      if (m < 510) return { date, ids: ["p1", "p2"] };
      if (m < 575) return { date, ids: ["p2"] };
      if (m < 655) return { date, ids: ["p3"] };
      if (m < 750) return { date, ids: ["p4"] };
      if (m < 790) return { date, ids: ["p4", "p5"] };
      if (m < 850) return { date, ids: ["p5"] };
      return nextSchoolDayView(now);
    }

    // Existing subject artwork in backgrounds; everything else uses placeholder.png.
    function backgroundFor(code) {
      if (code === "bs") return "backgrounds/businessstudies.png";
      if (code === "eco") return "backgrounds/economics.png";
      return "backgrounds/placeholder.png";
    }
    let activeBackground = "";
    function setBackground(code) {
      const url = backgroundFor(code);
      if (url === activeBackground) return;
      activeBackground = url;
      const img = new Image();
      img.onload = () => {
        if (activeBackground === url) {
          document.body.style.backgroundImage = 'url("' + url + '")';
          document.body.style.backgroundSize = "100% 100%";
        }
      };
      img.onerror = () => {
        if (activeBackground === url) {
          document.body.style.backgroundImage = 'url("backgrounds/placeholder.png")';
          document.body.style.backgroundSize = "100% 100%";
        }
      };
      img.src = url;
    }
    function render() {
      const view = upcoming(new Date());
      const container = document.getElementById("periods");
      container.replaceChildren();
      if (!view) {
        const row = document.createElement("div");
        row.className = "period-row";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "TIMETABLE FINISHED";
        row.append(label);
        container.append(row);
        fitRows();
        setBackground("NONE");
        return;
      }
      const schedule = scheduleFor(view.date);
      const firstCode = schedule[view.ids[0]] || "FREE";
      setBackground(firstCode);

      for (const id of view.ids) {
        const code = schedule[id] || "FREE";
        // Hide optional Period 0 when it is a FREE period.
        if (id === "p0" && code === "FREE") continue;
        const row = document.createElement("section");
        row.className = "period-row";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = periods.find(p => p.id === id).label;
        const subject = document.createElement("div");
        subject.className = "subject";
        subject.textContent = names[code] || code.toUpperCase();
        row.append(label, subject);
        container.append(row);
      }
      fitRows();
    }

    // Keep every row visible: reduce the type size only when the full stack
    // would exceed the viewport. Recalculate on resize and whenever the rows change.
    function fitRows() {
      const container = document.getElementById("periods");
      const labels = [...container.querySelectorAll(".label")];
      const subjects = [...container.querySelectorAll(".subject")];
      if (!labels.length) return;

      const mobile = window.innerWidth <= 600;
      const baseLabel = window.innerWidth * (mobile ? 0.04 : 0.02);
      const baseSubject = window.innerWidth * (mobile ? 0.08 : 0.06);
      const baseLabelGap = mobile ? 10 : 20;
      const baseRowGap = window.innerHeight * (mobile ? 0.02 : 0.025);
      let scale = 1;

      const applyScale = () => {
        labels.forEach(el => {
          el.style.fontSize = (baseLabel * scale) + "px";
          el.style.marginBottom = (baseLabelGap * scale) + "px";
        });
        subjects.forEach(el => {
          el.style.fontSize = (baseSubject * scale) + "px";
        });
        [...container.querySelectorAll(".period-row")].forEach(el => {
          el.style.marginBottom = (baseRowGap * scale) + "px";
        });
      };

      applyScale();
      // Measure the real rendered stack, then shrink enough to fit with a small
      // safety margin for font rendering and browser rounding.
      for (let i = 0; i < 3 && container.scrollHeight > container.clientHeight; i++) {
        scale *= Math.min(0.95, (container.clientHeight - 4) / container.scrollHeight);
        applyScale();
      }
      // If an unusually long subject still wraps, continue shrinking until it fits.
      while (container.scrollHeight > container.clientHeight && scale > 0.35) {
        scale *= 0.92;
        applyScale();
      }
    }

    window.addEventListener("resize", fitRows);
    render();
    setInterval(render, 15000);
  </script>
</body>
</html>
